[workspace]
resolver = "2"
members = ["core/recognize", "core/engine"]
exclude = ["vendor/cpal-0.18.1"]

[workspace.package]
# The release's own version (tags are v<version>): the update check compares it.
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Dependencies compile once and stay fast at runtime; our own crates stay quick to rebuild.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
# Live recognition must keep up with real audio even in a debug build.
[profile.dev.package.kvj-recognize]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
# Unwind, not abort: a decoder library panicking on a damaged file is caught
# at the C ABI (ffi.rs) and fails that one call instead of closing KVJ mid-show.
