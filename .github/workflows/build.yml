name: build

# Run by hand when Windows needs a build or a test pass; day-to-day work is
# built and tried on the Mac. Pushing a v* tag also publishes the release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# A newer push to the same branch replaces a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  # Built on a newer macOS, the app still opens from macOS 12 (Info.plist's
  # LSMinimumSystemVersion); CMake and Rust both read this.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            qt_arch: clang_64
          - os: windows-latest
            name: windows-x64
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test --release

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats qtshadertools qtmultimedia
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKVJ_BUILD_CHECKS=ON

      - name: Build
        run: cmake --build build

      # Test media for the checks. Chocolatey's ffmpeg no longer lands on PATH
      # (2026-11-18); a build from gyan.dev does.
      - name: FFmpeg
        shell: pwsh
        run: |
          if ($IsWindows) {
            Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
            Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
            (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName | Add-Content $env:GITHUB_PATH
          } elseif (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            brew install ffmpeg | Out-Null
          }

      - name: Decoder check (Media Foundation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=1920x1080:rate=30 -t 40 -c:v libx264 -g 60 -pix_fmt yuv420p sample.mp4
          $env:KVJ_MAX_HEIGHT = "720"
          # A fresh runner's first Media Foundation open is slow (over 2 s):
          # once to warm it, then the check that counts.
          ./build/kvj-player-check.exe sample.mp4 0 | Out-Null
          ./build/kvj-player-check.exe sample.mp4 0 20 5 30.5

      # Sound symphonia cannot read (or misreads), read by the system's decoders
      # through the engine as the app does. The same tone in each; macOS must
      # read them all. A Windows runner (Server, no Dolby or Opus decoders as
      # desktops have) is only reported.
      - name: System sound check
        shell: bash
        run: |
          mkdir -p sound
          mk() {
            out=$1; shift
            ffmpeg -v error -y -f lavfi -i testsrc=size=160x90:rate=30:duration=3 \
              -f lavfi -i sine=frequency=440:sample_rate=48000:duration=3 \
              -map 0 -map 1 -c:v libx264 -pix_fmt yuv420p "$@" "sound/$out"
          }
          mk aac.mp4 -c:a aac -ac 2
          mk mp3.mp4 -c:a libmp3lame -ac 2
          mk ipcm-s16.mp4 -c:a pcm_s16le -ac 2
          mk ipcm-s24.mp4 -c:a pcm_s24le -ac 2
          mk fpcm-f32.mp4 -c:a pcm_f32le -ac 2
          mk ipcm-6ch.mp4 -c:a pcm_s16le -ac 6
          mk aac-6ch.mp4 -c:a aac -ac 6
          mk ac3.mp4 -c:a ac3 -ac 2
          mk eac3.mp4 -c:a eac3 -ac 2
          mk opus.mp4 -c:a libopus -ac 2
          mk s16le.mov -c:a pcm_s16le -ac 2
          mk s24be.mov -c:a pcm_s24be -ac 2
          mk f32be.mov -c:a pcm_f32be -ac 2
          mk s16le-6ch.mov -c:a pcm_s16le -ac 6
          mk alac.mov -c:a alac -ac 2
          mk ulaw.mov -c:a pcm_mulaw -ac 2
          mk flac.mkv -c:a flac -ac 2
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/kvj-system-sound-check.exe "$RUNNER_TEMP/kvj-sound" 3 sound/* || echo "::warning::some sound Media Foundation on this runner does not read"
          else
            ./build/kvj-system-sound-check "$RUNNER_TEMP/kvj-sound" 3 sound/*
          fi

      # macOS runs headless (offscreen); Windows uses its real platform plugin, so
      # the screenshot shows system fonts and DirectWrite as users will see them.
      - name: Smoke test (screenshot)
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'macOS' && 'offscreen' || '' }}
          KVJ_DATA_DIR: ${{ runner.temp }}/kvj-data
          KVJ_SNAPSHOT: ${{ github.workspace }}/screenshot-${{ matrix.name }}.png
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./build/KVJ.exe; else ./build/KVJ.app/Contents/MacOS/KVJ; fi
          test -s "$KVJ_SNAPSHOT"

      - name: Package
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/dist"
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --deep --sign - dist/KVJ.app
            hdiutil create -volname KVJ -srcfolder dist/KVJ.app -ov -format UDZO KVJ-${{ matrix.name }}.dmg
            shasum -a 256 KVJ-${{ matrix.name }}.dmg > KVJ-${{ matrix.name }}.dmg.sha256
          else
            7z a KVJ-${{ matrix.name }}.zip ./dist/*
            sha256sum KVJ-${{ matrix.name }}.zip > KVJ-${{ matrix.name }}.zip.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KVJ-${{ matrix.name }}
          path: |
            KVJ-${{ matrix.name }}.dmg
            KVJ-${{ matrix.name }}.zip
            KVJ-${{ matrix.name }}.*.sha256
            screenshot-${{ matrix.name }}.png
          if-no-files-found: warn

  # A v* tag publishes its own release from this run's packages; the notes are
  # docs/releases/<tag>.md. A tag with a hyphen (v1.0.0-rc1) is a pre-release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: KVJ-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -s "docs/releases/$TAG.md" || { echo "missing docs/releases/$TAG.md"; exit 1; }
          case "$TAG" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
          # The .sha256 files are what the in-app update checks a download
          # against when GitHub gives no digest of its own.
          gh release create "$TAG" KVJ-macos-arm64.dmg KVJ-windows-x64.zip \
            KVJ-macos-arm64.dmg.sha256 KVJ-windows-x64.zip.sha256 \
            --title "KVJ $TAG" --notes-file "docs/releases/$TAG.md" --verify-tag $kind
